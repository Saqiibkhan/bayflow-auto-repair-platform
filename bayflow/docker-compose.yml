services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bayflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bayflow}
      POSTGRES_DB: ${POSTGRES_DB:-bayflow}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bayflow}"]
      interval: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bayflow}:${POSTGRES_PASSWORD:-bayflow}@db:5432/${POSTGRES_DB:-bayflow}
    depends_on:
      db: {condition: service_healthy}
    ports: ["${PORT:-8000}:8000"]
volumes:
  pgdata:
